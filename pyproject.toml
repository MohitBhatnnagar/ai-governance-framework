[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-framework"
version = "0.1.0"
description = "Risk tiering, approval matrix and incident process for AI use cases, mapped to NIST AI RMF, with a scoring tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
aigov = "aigov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
